name: Odoo Build

on:
  pull_request:
    branches:
      - "18.0"

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build Odoo Image (Test)
        run: |
          pip install invoke copier pre-commit
          inv git-aggregate
          docker build \
            -f odoo/Dockerfile \
            --build-arg ODOO_VERSION=18.0 \
            -t ghcr.io/${{ github.repository_owner }}/odoo-test:${{ github.sha }} \
            odoo
